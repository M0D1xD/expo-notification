name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['example/**']
  pull_request:
    branches: [main]
    paths-ignore: ['example/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        include:
          # Laravel 13 only for now (see PRD); the package also allows ^12.0.
          - php: '8.3'
            laravel: '13'
            testbench: '^11.0'
          - php: '8.4'
            laravel: '13'
            testbench: '^11.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, zlib, pdo_sqlite
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-
            ${{ runner.os }}-php-${{ matrix.php }}-

      - name: Install dependencies
        run: |
          composer update \
            --with="illuminate/console:^${{ matrix.laravel }}.0" \
            --with="illuminate/contracts:^${{ matrix.laravel }}.0" \
            --with="illuminate/database:^${{ matrix.laravel }}.0" \
            --with="illuminate/http:^${{ matrix.laravel }}.0" \
            --with="illuminate/routing:^${{ matrix.laravel }}.0" \
            --with="illuminate/support:^${{ matrix.laravel }}.0" \
            --with="illuminate/validation:^${{ matrix.laravel }}.0" \
            --with="orchestra/testbench:${{ matrix.testbench }}" \
            --prefer-dist \
            --no-interaction \
            --no-progress

      - name: Lint
        run: composer lint

      - name: Run tests
        run: composer test
