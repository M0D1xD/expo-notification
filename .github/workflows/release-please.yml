name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: self-hosted
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  # A release made with GITHUB_TOKEN doesn't trigger packagist.yml, so Packagist is notified here.
  packagist:
    name: Notify Packagist
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Update package on Packagist
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
          REPOSITORY_URL: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$PACKAGIST_USERNAME" ] || [ -z "$PACKAGIST_TOKEN" ]; then
            echo "::error::Missing secrets. Add PACKAGIST_USERNAME and PACKAGIST_TOKEN under Settings → Secrets and variables → Actions."
            exit 1
          fi
          RESPONSE="$(curl --fail-with-body -sS -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${PACKAGIST_USERNAME}:${PACKAGIST_TOKEN}" \
            -H "User-Agent: M0D1xD-expo-notification-github-actions (mailto:noreply@users.noreply.github.com)" \
            -d "{\"repository\":\"${REPOSITORY_URL}\"}" \
            "https://packagist.org/api/update-package")"
          echo "Packagist response: ${RESPONSE}"
          printf '%s' "$RESPONSE" | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data.get("status")=="success", data; print("Packagist status=success")'
